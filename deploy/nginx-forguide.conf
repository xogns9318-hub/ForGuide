# ForGuide Nginx 설정: 화면(vite build 결과)을 그대로 주고 /api는 백엔드로 넘긴다.
# 설치: sudo cp nginx-forguide.conf /etc/nginx/sites-available/forguide
#       sudo ln -sf /etc/nginx/sites-available/forguide /etc/nginx/sites-enabled/forguide
#       sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# 인증 메일 보내기(send-code) IP별 제한: 한 IP에서 1분에 5번 (주소를 바꿔 가며 메일을 마구 보내는 것을 막는다)
# limit_req_zone은 http 블록에 있어야 하는데, sites-enabled 파일은 http 블록 안에서 읽히므로 여기에 둔다
limit_req_zone $binary_remote_addr zone=forguide_mail:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/forguide;
    index index.html;

    # 사진 업로드 (서버 설정: 파일 4MB, 요청 20MB) — 백엔드 제한보다 조금 크게 둬서 초과 시 백엔드가 안내 메시지를 준다
    client_max_body_size 25m;

    # 인증 메일 보내기: IP별 제한을 걸고 나머지는 /api/와 같게 백엔드로 넘긴다
    # 잠깐 몰리는 요청은 3번까지 바로 받아 주고(burst), 넘으면 429와 서버와 같은 JSON 오류를 준다
    location = /api/v1/auth/email/send-code {
        limit_req zone=forguide_mail burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @mail_rate_limited;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 제한에 걸렸을 때: 화면이 번역 문구("잠시 후 다시 요청해주세요")로 보여 주도록 서버 오류 형식을 그대로 쓴다
    location @mail_rate_limited {
        default_type application/json;
        charset utf-8;
        return 429 '{"success":false,"error":{"code":"VERIFICATION_RESEND_TOO_SOON","message":"잠시 후 다시 요청해주세요."}}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 챗봇 답변·알림(SSE)이 모아졌다가 한 번에 가지 않게 버퍼링을 끈다
        proxy_buffering off;
        proxy_cache off;
        # 알림 연결은 최대 30분(서버 설정) 열려 있으므로 그보다 길게 기다린다
        proxy_read_timeout 35m;
        proxy_send_timeout 35m;
    }

    # 화면 주소(/service/loan 등)를 새로고침해도 index.html을 준다
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 결과물은 파일 이름에 해시가 붙어 오래 캐시해도 된다
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
