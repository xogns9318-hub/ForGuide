spring.datasource.url=jdbc:h2:mem:forguide;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 인증 테스트는 member/schema.sql로 필요한 테이블을 직접 준비한다.
spring.flyway.enabled=false
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# 테스트는 @Sql 스크립트가 테이블을 만든 뒤 진행하므로 서버 시작 관리자 초기화는 실행하지 않는다.
forguide.admin.initializer.enabled=false

# 인증(JWT) 테스트 전용 키 (실제 서비스에 쓰지 않는 값)
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LWZvci1yZWFsLXVzZS0wMTIzNDU2Nzg5

# 챗봇 테스트: 실제 OpenAI 키 없이(no-key) 시작한다. OpenAI 호출이 필요한 테스트는 ChatModel을 가짜로 바꾼다.
spring.ai.openai.api-key=no-key
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
forguide.chatbot.daily-limit=30
forguide.chatbot.max-question-length=500
forguide.chatbot.memory-size=10
