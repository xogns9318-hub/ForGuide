spring.application.name=ForGuide

# DB_URL, DB_USERNAME, DB_PASSWORD는 실행 환경에서 지정한다.
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.10.6:3306/forguide?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:forguide_user}
spring.datasource.password=${DB_PASSWORD:forguide}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.encoding=UTF-8

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

# 인증(JWT) — 비밀키는 저장소에 넣지 않고 환경변수 JWT_SECRET(Base64, 32바이트 이상)으로 받는다
jwt.secret=${JWT_SECRET:}
jwt.access-token-validity=30m
jwt.refresh-token-validity=14d
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# 프로필 이미지 업로드 (auth) — 4MB 이하. 다른 기능이 더 큰 파일을 받게 되면 해당 담당자가 값을 올린다
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
forguide.profile-image.dir=${PROFILE_IMAGE_DIR:uploads/profile-images}
