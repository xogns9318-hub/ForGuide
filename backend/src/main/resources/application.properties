spring.application.name=ForGuide

# 개인 개발 환경의 DB 설정 파일이 있을 때만 추가로 읽는다.
# 환경변수는 application-local.properties보다 우선한다.
spring.config.import=optional:classpath:application-local.properties

# 공용 DB 연결 정보는 실행 환경에서 전달한다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.encoding=UTF-8
# 이미 적용된 마이그레이션이 빠지거나 변경되면 서버 시작을 중단해 스키마 불일치를 막는다.
spring.flyway.validate-on-migrate=true
# V번호와 파일명 규칙이 맞지 않는 SQL 파일은 실행 전에 차단한다.
spring.flyway.validate-migration-naming=true
# 최신 버전보다 이전 버전의 SQL이 뒤늦게 실행되는 상황을 막는다.
spring.flyway.out-of-order=false
# 한 번의 실행에서 여러 SQL 파일을 하나의 묶음으로 처리하지 않아 실패 범위를 한 파일로 제한한다.
spring.flyway.group=false
# MySQL DDL과 트랜잭션 SQL을 같은 마이그레이션 파일에 섞지 않도록 차단한다.
spring.flyway.mixed=false
# 실수로 Flyway clean을 실행해 공유 DB 전체를 삭제하는 것을 차단한다.
spring.flyway.clean-disabled=true

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

# 인증(JWT) — 비밀키는 저장소에 넣지 않고 환경변수 JWT_SECRET(Base64, 32바이트 이상)으로 받는다
jwt.secret=${JWT_SECRET:}
jwt.access-token-validity=30m
jwt.refresh-token-validity=14d
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# 요청 안의 사진 한 장은 최대 20MB, 게시글 사진 4장과 전송 여유를 합쳐 최대 85MB로 제한
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=85MB

# 게시글 사진 저장 폴더
forguide.community-image.dir=${COMMUNITY_IMAGE_DIR:uploads/community-images}
forguide.profile-image.dir=${PROFILE_IMAGE_DIR:uploads/profile-images}

# 이메일 인증 코드 발송 (Gmail SMTP) — 계정·앱 비밀번호는 저장소에 넣지 않고 환경변수로 받는다
# 변수 이름에 FORGUIDE_를 붙인다: 같은 PC의 다른 프로젝트가 쓰는 MAIL_USERNAME 등을 잘못 읽지 않게
# FORGUIDE_MAIL_USERNAME이 비어 있으면 실제로 보내지 않고 서버 로그에 코드를 남긴다 (개발용)
spring.mail.host=${FORGUIDE_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${FORGUIDE_MAIL_PORT:587}
spring.mail.username=${FORGUIDE_MAIL_USERNAME:}
spring.mail.password=${FORGUIDE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 번역 결과 캐시 Redis 연결 정보
# 환경변수가 없으면 로컬 Redis를 기본으로 사용한다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Gemini 번역 API 설정
# 실제 키는 Git에서 제외된 application-local.properties 또는 실행 환경변수로만 전달
forguide.translation.gemini.api-key=${GEMINI_API_KEY:}
forguide.translation.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

# 긴 이력서 전체를 한번에 보내지 않도록 번역 요청 길이 제한
forguide.translation.max-source-length=5000
