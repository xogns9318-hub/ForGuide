spring.application.name=ForGuide

# DB_URL, DB_USERNAME, DB_PASSWORD는 실행 환경에서 지정한다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/forguide?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:forguide}
spring.datasource.password=${DB_PASSWORD:forguide}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.encoding=UTF-8

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30
